#!/usr/sbin/nft -f
# =====================================================================
# pg15 host firewall  --  Phase 1 (host INPUT filter only)
# Installed: 2026-09-08
#
# DESIGN RULES (why this file is shaped like this):
#   * NO 'flush ruleset' anywhere -> live/`systemctl restart nftables`
#     can NEVER wipe Docker's or NetBird's runtime tables.
#   * Our table is 'inet pg15fw' - a name NO other component uses, so
#     apply = delete+re-add only OUR table. Docker (ip/ip6/nat) and
#     NetBird (wt0 forward allows) stay byte-identical.
#   * We bind ONLY the INPUT hook. Forward/output are left untouched:
#     Docker published ports, inter-container traffic, and the NetBird
#     exit-node routing + masquerade all keep working exactly as before.
#   * INPUT default DROP; explicit allows for loopback, established/
#     related, the NetBird tunnel, the LAN, docker bridge subnets,
#     link-local, WireGuard endpoint, DHCP, mDNS, ICMP-from-LAN.
# =====================================================================

table inet pg15fw {
    chain input {
        type filter hook input priority filter; policy drop;

        # --- loopback: local services, dbus, resolved, webui origin ---
        iifname "lo" accept

        # --- replies to connections this host initiated (incl. NetBird
        #     control plane, apt, NTP, docker pull) ---
        ct state established,related accept

        # --- NetBird tunnel: ALL services reachable over NetBird is the
        #     intended posture (peers use NB IPs, 100.64.0.0/16) ---
        iifname "wt0" accept
        ip saddr 100.64.0.0/10 accept    # NB CGNAT space, belt & braces

        # --- LAN (eno1 + wlo1 both in 192.0.2.0/24): SSH, NPM,
        #     webui 8787/8899, NFS, Syncthing, HA, MQTT, Immich, ... ---
        ip saddr 192.0.2.0/24 accept

        # --- Docker bridge subnets -> host services (containers talking
        #     TO the host). RFC1918 172.16/12, not routable from LAN. ---
        ip saddr 172.16.0.0/12 accept

        # --- IPv6 link-local: NDP, DHCPv6, mDNS v6 ---
        ip6 saddr fe80::/10 accept

        # --- NetBird WireGuard endpoint (peers / NAT traversal) ---
        udp dport 51820 accept

        # --- DHCPv4 replies to the client port (router 192.0.2.1 is
        #     already covered by the LAN rule; this covers any relayed reply) ---
        udp dport 68 accept

        # --- mDNS discovery (multicast destinations, LAN sources) ---
        ip daddr 224.0.0.251 udp dport 5353 accept
        ip6 daddr ff02::fb udp dport 5353 accept

        # --- ICMP from LAN only (ping / traceroute); WAN ping dropped ---
        ip saddr 192.0.2.0/24 ip protocol icmp accept
    }
}